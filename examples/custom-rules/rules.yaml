apiVersion: wazuh.adorsys.team/v1alpha1
kind: WazuhRule
metadata:
  name: custom-ssh-rule
  namespace: wazuh-test
spec:
  clusterName: wazuh-manager
  rule: |
    <group name="syslog,sshd,">
      <rule id="100001" level="5">
        <if_sid>5716</if_sid>
        <match>Failed password for root</match>
        <description>Custom rule: SSH brute force attempt on root</description>
      </rule>
    </group>
---
apiVersion: wazuh.adorsys.team/v1alpha1
kind: WazuhDecoder
metadata:
  name: custom-ssh-decoder
  namespace: wazuh-test
spec:
  clusterName: wazuh-manager
  decoder: |
    <decoder name="custom-sshd">
      <program_name>^sshd</program_name>
    </decoder>
