apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-operator
  namespace: wazuh-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-operator
  template:
    metadata:
      labels:
        app: wazuh-operator
    spec:
      serviceAccountName: wazuh-operator
      containers:
      - name: operator
        image: wazuh-operator:latest
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/wazuh-operator
        - run
        - --namespace
        - all
        env:
        - name: RUST_LOG
          value: info
